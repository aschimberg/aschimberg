name: Sunday grading

on:
  schedule:
    - cron: "0 12 * * 0" # Sundays 12:00 UTC, after Saturday's late games are final
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cfb-data
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Grade picks (SU + ATS) and send weekly recap
        run: python -m cfbmodel grade
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - name: Commit data
        if: always()
        run: .github/scripts/commit-data.sh "Sunday grading"

  deploy:
    needs: grade
    uses: ./.github/workflows/deploy.yml
