name: Daily refresh

on:
  schedule:
    # Twice daily, off the top of the hour: GitHub delays (and can drop)
    # scheduled runs at :00 by hours under load, so the second run is a
    # safety net and keeps the board fresh. 10:23 / 22:23 UTC = 6:23 AM /
    # 6:23 PM ET. CFBD use: ~9 calls per run.
    - cron: "23 10 * * *"
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cfb-data
  cancel-in-progress: false

env:
  # Optional: The Odds API (multi-book NFL lines and anytime-TD odds). Unset = free sources only.
  # Only sports in ODDS_API_SPORTS (default "nfl") spend credits; NHL/NBA stay on free sources.
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh ratings, lines, picks, trends, splits
        run: python -m cfbmodel refresh
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SPLITS_PROVIDER: ${{ vars.SPLITS_PROVIDER || 'none' }}
          SPLITS_URL: ${{ vars.SPLITS_URL }}
          SPLITS_API_KEY: ${{ secrets.SPLITS_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - name: NFL refresh (nflverse)
        if: always()
        continue-on-error: true
        run: python -m nflmodel refresh
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - name: NHL refresh (NHL API)
        if: always()
        continue-on-error: true
        run: python -m nhlmodel refresh
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - name: NBA refresh (ESPN)
        if: always()
        continue-on-error: true
        run: python -m nbamodel refresh
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - name: Commit data
        if: always()
        run: .github/scripts/commit-data.sh "Daily refresh"

  deploy:
    needs: refresh
    uses: ./.github/workflows/deploy.yml
