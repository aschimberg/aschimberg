name: Probe data sources

on:
  workflow_dispatch:
    inputs:
      module:
        description: "tools module to run (e.g. probe_nba, probe_news)"
        default: probe_nba

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          MODULE: ${{ inputs.module || 'probe_nba' }}
        run: |
          case "$MODULE" in probe_*) python -m "tools.$MODULE" ;; *) echo "unknown module"; exit 1 ;; esac
